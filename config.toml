# The URL the site will be built for
# base_url = "https://huhu.io"
base_url = "/"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Syntax highlighting stays off. Zola 0.19+ rejects the old top-level
# `highlight_code` key, and later releases removed `[markdown].highlight_code`.
# CI pins Zola 0.17.2 (same as the other huhu sites). This site has no fenced
# code blocks, so the key is omitted and the file stays valid on 0.17.2.

[extra]
# Put all your custom variables here
extensions = [
