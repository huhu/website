name: Build and deploy huhu.io

# GitHub Pages serves the static site from branch `now` (root), the same way
# the other huhu docs sites publish. Cloudflare Pages / Wrangler is not used.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Zola 0.17.2
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.17.2

      - name: Build site
        run: ./scripts/build-site.sh

      - name: Publish now branch and GitHub Pages
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-docs.sh
