name: Build and deploy huhu.io

# Git-connected Cloudflare Pages on account 8061dbdcbf07c89772f0942f60e775aa
# fails every push in ~10s with no log text (check title stays "Building").
# This publishes the same project by direct upload, matching huhu/query.rs.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Zola 0.22.1
        run: |
          curl -fsSL -o /tmp/zola.tar.gz https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/zola.tar.gz -C /tmp
          sudo mv /tmp/zola /usr/local/bin/zola
          zola --version

      - name: Build site
        run: |
          npm ci
          # Do not set ENV=production. That purges Tailwind; live huhu.io serves the full sheet.
          ./node_modules/.bin/postcss css/index.css -d static/css
          zola build
          grep -q meiguo.app public/index.html

      - name: Require Cloudflare API token
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_PAGES_TOKEN" ]; then
            echo "Blocked: Actions on huhu/website has neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_PAGES_TOKEN."
            echo "The token needs Pages edit on account 8061dbdcbf07c89772f0942f60e775aa (project website)."
            echo "The Cursor Cloudflare connection is a different account and cannot deploy this project."
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '8061dbdcbf07c89772f0942f60e775aa' }}
          # Detached HEAD cannot tell Wrangler the production branch.
          command: pages deploy public --project-name=website --branch=master --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "3"
