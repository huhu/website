{% set section = get_section(path="_index.md") %}
<header>
    <a class="logo" href="/">
        HUHU
    </a>
    <nav>
        <div class="nav-item subtitle-text">
            <div id="nav-products" style="cursor: pointer">Products ▾</div>
            <div id="menu-product" class="menu" style="display: none">
                <div class="menu-content">
                    <div>
                        <div>Search extensions</div>
                        <div class="text menu-item">
                            <a class="search-link" href="/products/#rust-search-extension">
                                <img src="/img/rust.png" alt="">
                                <div>Rust</div>
                            </a>
                            <a class="search-link" href="/products/#go-search-extension">
                                <img src="/img/golang.png" alt="">
                                <div>Golang</div>
                            </a>
                            <a class="search-link" href="/products/#js-search-extension">
                                <img src="/img/javascript.png" alt="">
                                <div>Javascript</div>
                            </a>
                            <a class="search-link" href="/products/#cpp-search-extension">
                                <img src="/img/cpp.png" alt="">
                                <div>C/C++</div>
                            </a>
                        </div>
                    </div>
                    <div>
                        <div>Productivity tools</div>
                    </div>
                </div>
                <div class="menu-bottom"><a href="/products">See all our products ></a></div>
                <!-- <img class="menu-bubble-left" src="/img/blue-bubble.svg" alt=""> -->
                <img class="menu-bubble-right" src="/img/orange-black.svg" alt="">
            </div>
        </div>
        <a class="nav-item subtitle-text" href="https://blog.huhu.io">Blog</a>
        <a class="nav-item subtitle-text" href="/about">About</a>
    </nav>
    <script>
        let productNav = document.getElementById("nav-products");
        let productMenu = document.getElementById("menu-product");
        let timeout = 0;
        productNav.onmouseover = () => {
            if (timeout) {
                clearTimeout(timeout);
            }
            productMenu.style.display = "block";
        };
        productMenu.onmouseleave = productNav.onmouseleave = () => {
            timeout = setTimeout(() => {
                productMenu.style.display = "none";
            }, 200);
        };
        productMenu.onmouseover = () => {
            if (timeout) {
                clearTimeout(timeout);
            }
        };
    </script>
</header>
