<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="keywords"
      content="huhu.io, rust search extension, go search extension, developer tools, productivity tools">
<link rel="shortcut icon" href="favicon.ico">
<meta itemprop="name"
      content="{{ config.extra.meta_title }}">
<meta itemprop="description"
      content="{{ config.extra.meta_description }}">
<meta itemprop="image" content="{{ config.extra.meta_banner }}">

<meta property="og:url" content="https://huhu.io">
<meta property="og:type" content="website">
<meta property="og:title"
      content="{{ config.extra.meta_title }}">
<meta property="og:description"
      content="{{ config.extra.meta_description }}">
<meta property="og:image" content="{{ config.extra.meta_banner }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@_huhuio">
<meta name="twitter:creator" content="@_huhuio">
<meta name="twitter:title"
      content="{{ config.extra.meta_title }}">
<meta name="twitter:description"
      content="{{ config.extra.meta_description }}">
<meta name="twitter:image" content="{{ config.extra.meta_banner }}">
